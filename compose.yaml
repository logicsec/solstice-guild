services:
  solstice:
    build: .
    restart: unless-stopped
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://solsticeguild.net}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?Set the Discord application ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:?Set the Discord client secret}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:?Set the Discord server ID}
      CMS_ADMIN_DISCORD_IDS: ${CMS_ADMIN_DISCORD_IDS:-}
      SQLITE_PATH: /data/solstice.sqlite
    ports:
      - "${SOLSTICE_BIND_IP:-127.0.0.1}:${SOLSTICE_PORT:-3000}:3000"
    volumes:
      - solstice_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  solstice_data:
