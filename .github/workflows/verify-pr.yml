name: Verify Pull Request
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run check
      - run: node --check src/index.js
      - run: node --check src/gear-planner.js
      - run: node --check src/gear-planner-page.js
      - run: node --check public/assets/gear-planner.js
