name: Deploy Solstice Guild to Komodo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solstice-komodo-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Run tests
        run: npm run check

      - name: Deploy stack and verify production health
        timeout-minutes: 10
        env:
          KOMODO_API_KEY: ${{ secrets.KOMODO_API_KEY }}
          KOMODO_API_SECRET: ${{ secrets.KOMODO_API_SECRET }}
          KOMODO_DIAGNOSTIC_UPDATE: 6b04a546a8212b8bd4da52f5
        run: node scripts/deploy-komodo.mjs
